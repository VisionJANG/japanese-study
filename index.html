<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VOCABOX">
<meta name="theme-color" content="#FEFEFC">
<title>VOCABOX — JLPT</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F6FA; --bg:#FFFFFF; --line:#E7EAF0; --rule:#E6E9EF; --card:#FFFFFF;
    --ink:#111722; --ink-2:#464E5E; --ink-3:#7A8292;
    --brand:#1E50A2; --brand-2:#2F66C6; --brand-soft:#EAF0FB;
    --shu:#EE4B30; --ok:#12A15E;
    --radius-lg:18px; --radius-md:12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; overscroll-behavior:none}
  body{position:fixed; inset:0; font-family:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif; color:var(--ink);
    background:#FEFEFC; overflow:hidden; -webkit-font-smoothing:antialiased; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
  button{font-family:inherit; color:inherit}
  button:focus-visible{outline:2.5px solid #3B82F6; outline-offset:2px}
  .jp{font-family:"Klee One",serif}

  /* 실제 화면: 줄노트 배경 + 안전 영역 */
  .screen{position:fixed; inset:0; overflow:hidden; background-color:#FEFEFC;
    background-image:repeating-linear-gradient(to bottom, transparent 0, transparent 33px, rgba(80,120,190,.13) 33px, rgba(80,120,190,.13) 34px);
    background-position:0 calc(var(--safe-top) + 8px);
    --safe-top:calc(env(safe-area-inset-top, 0px) + 14px); --safe-bottom:calc(env(safe-area-inset-bottom, 0px) + 10px)}
  .screen.compact{--safe-top:calc(env(safe-area-inset-top, 0px) + 10px); --safe-bottom:calc(env(safe-area-inset-bottom, 0px) + 6px)}
  .view{position:absolute; inset:0; display:none; flex-direction:column; z-index:1;
    padding:var(--safe-top) max(20px, calc(env(safe-area-inset-right, 0px) + 12px)) var(--safe-bottom) max(20px, calc(env(safe-area-inset-left, 0px) + 12px))}
  .view.active{display:flex}

  /* 처음 실행: 단어 파일 불러오기 */
  .setup{justify-content:center; align-items:center; text-align:center; gap:18px}
  .setup .brand .title{justify-content:center}
  .setup-card{width:100%; max-width:420px; background:#fff; border-radius:20px; padding:22px 20px; text-align:left;
    box-shadow:0 0 0 1px #E2E6ED, 0 12px 32px rgba(20,30,50,.08)}
  .setup-card ol{margin:0; padding-left:20px; font-size:14px; line-height:1.75; color:var(--ink-2)}
  .setup-card b{color:var(--ink)}
  .setup-msg{min-height:20px; font-size:13px; color:var(--ink-3)}
  .setup-msg.err{color:var(--shu)}
  .tool-btn{border:0; background:none; color:var(--brand); font-size:14px; font-weight:600; cursor:pointer; padding:8px}
  .data-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px}
  .data-row .btn{flex:1 1 140px; height:44px; font-size:14px}
  .fix-btn{flex:none; border:1px solid #E2E6ED; background:#fff; border-radius:10px; padding:8px 10px; font-size:12.5px; font-weight:700; color:var(--ink-2); cursor:pointer; white-space:nowrap}
  .toast{position:absolute; left:50%; bottom:calc(var(--safe-bottom) + 84px); transform:translateX(-50%); z-index:9; background:var(--ink); color:#fff;
    padding:10px 16px; border-radius:12px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .data-note{margin:10px 0 0; font-size:12px; line-height:1.55; color:var(--ink-3)}
  /* 스크롤바: 얇고 둥근 반투명 막대, 평소엔 거의 안 보이다가 마우스를 올리면 진해짐 */
  .screen *{scrollbar-width:thin; scrollbar-color:rgba(20,30,50,.14) transparent}
  .screen *:hover{scrollbar-color:rgba(20,30,50,.28) transparent}
  .screen ::-webkit-scrollbar{width:10px; height:10px}
  .screen ::-webkit-scrollbar-track{background:transparent}
  .screen ::-webkit-scrollbar-thumb{background:rgba(20,30,50,.14); border-radius:10px; border:3px solid transparent; background-clip:padding-box}
  .screen ::-webkit-scrollbar-thumb:hover{background-color:rgba(20,30,50,.3)}
  .screen ::-webkit-scrollbar-corner{background:transparent}
  /* 스크롤 영역 위·아래 끝은 부드럽게 흐려지게 */
  .tabbed{-webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 calc(var(--safe-top) - 6px), #000 calc(100% - 40px), transparent 100%);
          mask-image:linear-gradient(to bottom, transparent 0, #000 calc(var(--safe-top) - 6px), #000 calc(100% - 40px), transparent 100%)}

  /* ================= 홈 (학습 탭) ================= */
  .tabbed{padding-bottom:calc(var(--safe-bottom) + 84px) !important; overflow-y:auto}
  .tabbed > *{flex-shrink:0}
  .home-view{gap:18px}
  /* 시작 화면 위쪽: 노트 표지처럼 제목 + 이중 괘선 */
  .h-top{grid-area:top; padding:24px 0 6px}
  .brand .title{display:flex; align-items:center; gap:12px}
  .brand .mark{font-family:"Klee One"; font-weight:600; font-size:42px; line-height:1; letter-spacing:.04em; color:var(--ink)}
  .seal{display:inline-grid; place-items:center; height:24px; padding:0 7px; border:1.8px solid var(--shu); border-radius:6px; background:rgba(255,255,255,.6);
    color:var(--shu); font:700 11px/1 "IBM Plex Sans KR"; letter-spacing:.08em; transform:rotate(-6deg) translateY(2px)}
  .brand .lead{margin:16px 0 0; font-size:17px; font-weight:600; color:var(--ink); line-height:1.45; word-break:keep-all}
  .brand .sub{margin:4px 0 0; font-size:14px; color:var(--ink-2); line-height:1.5; word-break:keep-all}

  .sec{grid-area:sec; display:flex; align-items:baseline; justify-content:space-between; margin:6px 2px -6px; font-size:17px; font-weight:700}
  .sec small{font-size:13px; font-weight:500; color:var(--ink-3)}
  /* 레벨 = 노트에 붙여 둔 포스트잇 */
  .decks{grid-area:decks; display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px 16px; align-content:start; padding:6px 6px 16px}
  .deck{position:relative; display:flex; flex-direction:column; justify-content:space-between; gap:8px; aspect-ratio:1 / .64;
    min-width:0; padding:16px 15px 13px; text-align:left; cursor:pointer; border:0; border-radius:2px 2px 4px 2px; color:#2A2620;
    /* 위쪽 접착 띠 + 오른쪽 아래로 갈수록 살짝 들뜬 음영 */
    background:
      linear-gradient(to bottom, rgba(0,0,0,.022) 0, rgba(0,0,0,.022) 11%, rgba(255,255,255,.25) 11%, rgba(255,255,255,0) 50%),
      linear-gradient(150deg, rgba(255,255,255,0) 62%, rgba(80,60,20,.07) 100%),
      var(--pi);
    box-shadow:0 1px 1px rgba(60,45,20,.10), 0 12px 14px -10px rgba(60,45,20,.38), 8px 14px 16px -14px rgba(60,45,20,.45);
    transform:rotate(var(--rot, 0deg)); transition:transform .2s ease}
  .deck:nth-child(1){--rot:-1.6deg} .deck:nth-child(2){--rot:1.2deg} .deck:nth-child(3){--rot:.8deg}
  .deck:nth-child(4){--rot:-1.1deg} .deck:nth-child(5){--rot:1.4deg}
  .deck:active{transform:rotate(0deg) scale(.98)}
  .deck:focus-visible{outline:2.5px solid var(--brand); outline-offset:4px}
  .deck .lvname{font-size:30px; font-weight:800; letter-spacing:-.02em; line-height:1; color:var(--lv-d)}
  .deck .t{font-family:"Klee One"; font-size:15px; font-weight:600; margin-top:5px; color:#3D372D}
  .deck .t small{margin-left:6px; font-family:"IBM Plex Sans KR"; font-size:12px; font-weight:500; color:rgba(42,38,32,.55); white-space:nowrap}
  .deck .foot{display:flex; flex-direction:column; gap:6px}
  .deck .pct{display:flex; align-items:baseline; justify-content:space-between; font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--lv-d)}
  .deck .pct small{font-size:11.5px; font-weight:500; color:rgba(42,38,32,.6)}
  .deck .meter{height:5px; border-radius:3px; background:rgba(42,38,32,.1); overflow:hidden}
  .deck .meter i{background:var(--lv-d)}
  .meter{grid-column:2/4; height:6px; border-radius:3px; background:#EDF1F8; overflow:hidden}
  .meter i{display:block; height:100%; border-radius:3px; background:var(--lv-strong)}

  /* 하단 탭 */
  /* 하단 탭: 떠 있는 흰 바. 고른 탭은 형광펜 표시 (모드 선택과 같은 방식) */
  .tabbar{position:absolute; z-index:2; left:14px; right:14px; bottom:calc(var(--safe-bottom) - 2px); display:flex; height:64px; padding:0 6px;
    margin:0 auto; max-width:460px; border-radius:22px; background:#fff;
    box-shadow:0 0 0 1px rgba(20,30,50,.07), 0 10px 26px -8px rgba(20,30,50,.22), 0 2px 6px rgba(20,30,50,.06)}
  .screen.in-quiz .tabbar{display:none}
  .tab{position:relative; flex:1; border:0; background:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    font:600 12.5px/1.2 "IBM Plex Sans KR"; color:var(--ink-2); -webkit-tap-highlight-color:transparent; transition:color .2s}
  .tab svg{width:25px; height:25px; stroke-width:1.9}
  .tab .lb{position:relative; isolation:isolate; padding:0 3px}
  .tab .lb::before{content:""; position:absolute; z-index:-1; left:-3px; right:-3px; bottom:0; height:.62em; background:#FFE066; opacity:.9;
    border-radius:3px 6px 3px 7px / 6px 3px 7px 3px; transform:scaleX(0) skewX(-14deg); transform-origin:0 50%; transition:transform .35s cubic-bezier(.3,.8,.25,1)}
  .tab.on{color:var(--ink)}
  .tab.on svg{stroke-width:2.3}
  .tab.on .lb{font-weight:700}
  .tab.on .lb::before{transform:scaleX(1) skewX(-14deg)}
  .tab:not(.on):active{color:var(--ink)}
  .tab:focus-visible{outline:2px solid var(--brand); outline-offset:-4px; border-radius:16px}
  .tab .dot{position:absolute; top:7px; left:calc(50% + 7px); min-width:17px; height:17px; padding:0 5px; border-radius:9px; background:var(--shu); color:#fff;
    font-size:10.5px; font-weight:700; line-height:17px; box-shadow:0 0 0 2px #fff}

  /* 오답노트 / 기록 탭 공통 */
  .page-title{padding-top:14px; font-size:28px; font-weight:700; letter-spacing:-.01em}
  .page-sub{margin-top:-10px; font-size:14px; color:var(--ink-3)}
  .panel{background:#fff; border:1px solid var(--line); border-radius:20px; padding:16px 18px; box-shadow:0 6px 18px rgba(60,55,40,.07)}
  .panel h3{margin:0 0 6px; font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px}
  .chip-lv{display:inline-grid; place-items:center; height:22px; padding:0 8px; border-radius:7px; font-size:12px; font-weight:700}
  .note-tip{margin:-4px 2px 0; font-size:12.5px; line-height:1.5; color:var(--ink-3)}
  .empty{padding:48px 12px; text-align:center; color:var(--ink-3); font-size:14px; line-height:1.6}
  .note-cta{display:flex; align-items:center; gap:14px; padding:16px 18px; border-radius:20px; background:var(--brand); box-shadow:0 10px 24px rgba(30,80,162,.22); color:#fff}
  .note-cta .n{font-size:28px; font-weight:700; font-variant-numeric:tabular-nums}
  .note-cta .l{flex:1; font-size:13px; color:rgba(255,255,255,.7); line-height:1.45}
  .note-cta button{height:42px; padding:0 16px; border:0; border-radius:12px; background:#fff; color:var(--brand); font-weight:700; font-size:14px; cursor:pointer}

  .tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  .tile{background:#fff; border:1px solid var(--line); border-radius:18px; padding:14px; box-shadow:0 6px 18px rgba(60,55,40,.07)}
  .tile b{display:block; font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  .tile span{font-size:12px; color:var(--ink-3)}
  .week{display:grid; grid-template-columns:repeat(7,1fr); gap:10px; align-items:end; height:120px; margin-top:12px}
  .week div{display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%}
  .week i{width:100%; max-width:26px; border-radius:7px 7px 3px 3px; background:#D5E0F4; min-height:4px}
  .week .now i{background:var(--brand)}
  .week span{font-size:11px; color:var(--ink-3)}
  .week .now span{color:var(--brand); font-weight:700}
  .lvrow{display:grid; grid-template-columns:36px 1fr auto; align-items:center; gap:12px; padding:9px 0; font-size:13px}
  .lvrow b{font-weight:700} .lvrow .meter{grid-column:auto}
  .lvrow span{color:var(--ink-3); font-variant-numeric:tabular-nums; min-width:68px; text-align:right}

  /* iPhone 가로: 왼쪽 오늘 카드, 오른쪽 레벨 */
  .compact .tabbar{height:46px; max-width:420px; border-radius:16px; bottom:calc(var(--safe-bottom) - 6px)}
  .compact .tab{flex-direction:row; gap:7px; font-size:12.5px}
  .compact .tab svg{width:20px; height:20px}
  .compact .tab .dot{position:static; margin:0 0 0 -2px}
  .compact .tabbed{padding-bottom:calc(var(--safe-bottom) + 50px) !important}
  .compact .home-view.active{display:grid; grid-template-columns:260px 1fr; grid-template-areas:"top decks"; column-gap:20px; align-items:center; padding-top:calc(var(--safe-top) + 4px)}
  .compact .sec{display:none}
  .compact .h-top{padding:0 0 14px}
  .compact .brand .mark{font-size:32px}
  .compact .brand .lead{margin-top:12px; font-size:14px}
  .compact .brand .sub{font-size:12px}
  .compact .decks{align-self:stretch; overflow-y:auto; grid-template-columns:repeat(3, minmax(0, 1fr)); padding:10px 10px 14px; gap:16px 14px}
  .compact .deck{aspect-ratio:auto; min-height:118px; padding:14px 13px 12px; gap:8px}
  .compact .deck .lvname{font-size:24px}
  .compact .deck .t{font-size:13.5px; margin-top:3px}

  /* iPad */
  .wide .tabbed{padding-left:max(40px, calc(50% - 480px)) !important; padding-right:max(40px, calc(50% - 480px)) !important}
  .wide .home-view.active{display:grid; grid-template-columns:1fr; grid-template-areas:"top" "sec" "decks"; row-gap:16px; align-content:start}
  .wide .h-top{padding:48px 0 22px}
  .wide .brand .mark{font-size:52px}
  .wide .brand .lead{font-size:20px}
  .wide .decks{grid-template-columns:repeat(5, minmax(0, 1fr)); gap:24px 22px; padding-top:10px}
  .wide .deck{aspect-ratio:1 / 1; padding:24px 18px 18px}
  .wide .deck .lvname{font-size:36px}

  /* ================= 퀴즈 화면 ================= */
  .quiz-view{gap:14px}
  .qhead{display:grid; grid-template-columns:44px 1fr 44px; align-items:center; height:44px}
  .icon-btn{width:40px; height:40px; border:0; border-radius:50%; background:transparent; display:grid; place-items:center; cursor:pointer}
  .icon-btn:hover{background:var(--brand-soft)}
  .qtitle{text-align:center; font-weight:600; font-size:16px}
  .qtitle span{color:var(--ink-2); font-weight:500; margin-left:4px}
  .tally{justify-self:end; display:flex; gap:10px; font-size:14px; font-weight:600; font-variant-numeric:tabular-nums}
  .tally span{display:inline-flex; align-items:center; gap:4px}
  .tally svg{width:13px; height:13px}
  .tally .t-ok{color:var(--ok)} .tally .t-ng{color:var(--shu)}

  /* 이번 회차(최대 20단어) 진행 — 얇은 한 줄 */
  .bar{height:3px; border-radius:2px; background:#E3EAF6; overflow:hidden; margin-top:-6px}
  .bar i{display:block; height:100%; width:0; background:var(--brand); border-radius:2px; transition:width .35s ease}

  .main{flex:1; display:flex; gap:16px; min-height:0}
  .vertical .main{flex-direction:column}
  .vertical .flash{flex:0 0 31%; transition:flex-basis .45s cubic-bezier(.3,.7,.2,1)}
  .vertical .flash.flipped{flex-basis:var(--back-h, 52%)}

  /* --- 단어 카드 (뒤집힘) --- */
  .flash{flex:1; perspective:1200px; min-height:0; min-width:0}
  .flash-inner{position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .55s cubic-bezier(.3,.7,.2,1)}
  .flash.flipped .flash-inner{transform:rotateY(180deg)}
  .face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:var(--radius-lg);
    background:var(--card); box-shadow:0 0 0 1px #E2E6ED, 0 1px 2px rgba(20,30,50,.04), 0 12px 32px rgba(20,30,50,.08);
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center; overflow:hidden}
  .face .hole{position:absolute; top:16px; left:22px; width:14px; height:14px; border-radius:50%; background:var(--paper); box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
  .face .chip{position:absolute; top:14px; right:16px; font-size:12px; font-weight:700; padding:3px 9px; border-radius:99px; background:var(--lv); color:var(--lv-d)}
  .back{transform:rotateY(180deg)}
  .face .rv-tag{position:absolute; top:14px; left:44px; display:none; align-items:center; gap:4px; height:22px; padding:0 8px; border-radius:99px;
    background:#FFF0EC; color:var(--shu); font-size:11.5px; font-weight:700}
  .face .rv-tag::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--shu)}
  .face .rv-tag.on{display:inline-flex}
  /* 앞면: 뜻 + 품사 (+ 같은 표기 구분 힌트) */
  .f-hint{font-family:"Klee One"; font-size:16px; color:var(--ink-2); margin-bottom:10px; padding:4px 10px; border-radius:8px; background:var(--paper)}
  .f-meaning{font-size:30px; font-weight:700; line-height:1.3; word-break:keep-all; letter-spacing:-.01em; max-width:92%}
  .f-pos{font-size:13px; color:var(--ink-3); margin-top:8px}

  /* 뒷면: 정답 + 예문 */
  .back{justify-content:space-between; gap:14px; padding:40px 18px 18px}
  .b-head{flex:1 0 auto; display:flex; flex-direction:column; align-items:center; justify-content:center}
  .back{overflow-y:auto}
  .b-reading{font-family:"Klee One"; font-size:15px; color:var(--ink-2); letter-spacing:.12em; margin-bottom:2px}
  .b-kanji{font-family:"Klee One"; font-weight:600; font-size:50px; line-height:1.1; white-space:nowrap}
  .b-meaning{font-size:16px; font-weight:600; color:var(--ink); margin-top:10px; word-break:keep-all}
  .b-pos{font-size:12px; color:var(--ink-3); margin-top:3px}

  /* 예문: 카드 안의 옅은 패널, 후리가나 + 표제어 형광펜 */
  .b-ex{width:100%; text-align:left; background:var(--paper); border-radius:12px; padding:10px 14px 12px}
  .ex-jp{margin:0; font-family:"Klee One"; font-size:17px; line-height:2.15; color:var(--ink); word-break:normal; line-break:strict}
  .ex-jp ruby{ruby-align:center}
  .ex-jp rt{font-family:"Klee One"; font-size:9.5px; color:var(--ink-3); letter-spacing:.02em}
  .ex-jp mark{color:inherit; font-weight:600; padding:0 1px; border-radius:2px;
    background:linear-gradient(transparent 58%, rgba(229,65,46,.20) 58%, rgba(229,65,46,.20) 92%, transparent 92%)}
  .ex-ko{margin:0; font-size:13px; line-height:1.5; color:var(--ink-2)}

  /* --- 필기 칸 --- */
  .pad{flex:1; display:flex; flex-direction:column; gap:8px; min-width:0; min-height:0}
  .sheet{flex:1; position:relative; border-radius:var(--radius-lg); background-color:#fff; overflow:hidden;
    box-shadow:0 0 0 1px #E2E6ED, 0 1px 2px rgba(20,30,50,.04), 0 12px 32px rgba(20,30,50,.08);
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px),
      linear-gradient(90deg, var(--rule) 1px, transparent 1px),
      linear-gradient(#F1F3F6 1px, transparent 1px),
      linear-gradient(90deg, #F1F3F6 1px, transparent 1px);
    background-size:88px 88px, 88px 88px, 44px 44px, 44px 44px;
    background-position:-1px -1px}
  .sheet canvas{position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:crosshair}
  .sheet.locked canvas{cursor:default}
  .hint{position:absolute; inset:0; display:grid; place-items:center; text-align:center; color:var(--ink-3); font-size:14px; line-height:1.6; pointer-events:none}
  .stamp{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
  .stamp path{fill:none; stroke:var(--shu); stroke-linecap:round; stroke-linejoin:round; opacity:.88}
  .stamp.draw path{animation:pen .55s cubic-bezier(.5,0,.3,1) forwards}
  .stamp.draw path + path{animation-duration:.3s; animation-delay:.32s}
  .stamp.draw path:first-child:not(:only-child){animation-duration:.3s}
  @keyframes pen{to{stroke-dashoffset:0}}

  .tools{display:flex; justify-content:space-between; align-items:center}
  .tool{display:inline-flex; align-items:center; gap:6px; border:0; background:none; font-size:13px; font-weight:600; color:var(--ink-2); cursor:pointer; padding:6px 4px; border-radius:6px}
  .tool:disabled{opacity:.35; cursor:default}

  /* --- 하단 --- */
  .bottom{display:flex; flex-direction:column; gap:10px}
  .verdict{display:none; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--radius-md); background:var(--card);
    border:1px solid var(--line); box-shadow:0 6px 18px rgba(20,30,50,.06)}
  .verdict.show{display:flex}
  .verdict .mark{width:34px; height:34px; flex:none}
  .verdict .txt{flex:1; min-width:0}
  .verdict .h{font-weight:700; font-size:16px}
  .verdict.ok .h{color:var(--ok)} .verdict.ng .h{color:var(--shu)}
  .verdict .s{font-size:13px; color:var(--ink-2); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .verdict .s .jp{color:var(--ink); font-weight:600}
  .grade{display:flex; gap:6px}
  .grade button{border:1px solid var(--rule); background:#fff; border-radius:10px; padding:8px 12px; font-size:13px; font-weight:600; cursor:pointer}
  .grade .g-ok{color:var(--ok)} .grade .g-ng{color:var(--shu)}

  .btn{border:0; border-radius:14px; height:54px; width:100%; font-size:17px; font-weight:600; cursor:pointer; transition:transform .1s, opacity .2s}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--brand); color:#fff; box-shadow:0 8px 20px rgba(30,80,162,.25)}
  .btn.primary:disabled{box-shadow:none}
  .btn.ghost{background:rgba(255,255,255,.85); color:var(--brand); box-shadow:inset 0 0 0 1.5px #C9D6EE}
  .btn:disabled{opacity:.3; cursor:default}

  /* --- 결과 --- */
  .result{flex:1; display:none; flex-direction:column; gap:20px; min-height:0}
  .result.show{display:flex}
  .score{display:flex; align-items:flex-end; gap:16px; padding-top:8px}
  .score .num{font-size:64px; font-weight:700; line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
  .score .num small{font-size:26px; color:var(--ink-3); font-weight:600}
  .score .msg{font-size:15px; color:var(--ink-2); padding-bottom:8px}
  .review{flex:1; overflow-y:auto; background:var(--card); border-radius:var(--radius-lg); padding:6px 18px;
    border:1px solid var(--line); box-shadow:0 6px 18px rgba(60,55,40,.07)}
  .review h3{margin:12px 0 4px; font-size:14px; font-weight:600; color:var(--ink-2)}
  .rv{display:flex; align-items:center; gap:16px; padding:12px 0; border-top:1px solid var(--rule)}
  .rv:first-of-type{border-top:0}
  .rv .kw{flex:1; min-width:0}
  .rv .k{display:block; font-family:"Klee One"; font-weight:600; font-size:22px; line-height:1.25}
  .rv .r{display:block; font-family:"Klee One"; color:var(--ink-2); font-size:13px}
  .rv .m{max-width:58%; text-align:right; font-size:14px; word-break:keep-all}
  .perfect{display:grid; place-items:center; height:100%; color:var(--ink-2); text-align:center; padding:24px 0}
  .result .actions{display:flex; flex-direction:column; gap:10px}

  /* --- 가로(높이 낮은 화면) --- */
  .compact .view{padding-left:56px; padding-right:56px}
  .compact .quiz-view{gap:8px}
  .compact .qhead{height:36px}
  .compact .bottom{flex-direction:row; align-items:stretch}
  .compact .verdict{flex:2; padding:8px 12px}
  .compact .bottom .btn{flex:1; height:auto; min-height:48px}
  .compact .f-meaning{font-size:26px}
  .compact .back{padding:30px 16px 12px; gap:8px}
  .compact .b-reading{font-size:12px}
  .compact .b-kanji{font-size:34px}
  .compact .b-meaning{margin-top:4px; font-size:14px}
  .compact .b-pos{display:none}
  .compact .b-ex{padding:6px 12px 8px}
  .compact .ex-jp{font-size:14px; line-height:1.95}
  .compact .ex-jp rt{font-size:8px}
  .compact .ex-ko{font-size:12px}
  .compact .result{flex-direction:row}
  .compact .result .left{width:240px; display:flex; flex-direction:column; justify-content:space-between; gap:12px}
  .compact .score .num{font-size:52px}
  .result .left{display:contents}
  .compact .result .left{display:flex}

  /* --- iPad --- */
  .wide .view{padding-left:40px; padding-right:40px}
  .wide .f-meaning{font-size:40px}
  .wide .b-kanji{font-size:80px}
  .wide .b-reading{font-size:20px}
  .wide .b-meaning{font-size:20px; margin-top:14px}
  .wide .b-pos{font-size:14px}
  .wide .back{padding:48px 28px 28px}
  .wide .b-ex{padding:16px 20px 18px; border-radius:16px}
  .wide .ex-jp{font-size:22px}
  .wide .ex-jp rt{font-size:12px}
  .wide .ex-ko{font-size:15px}
  .rv .m small{display:block; font-size:12px; color:var(--ink-3)}
  .wide .bottom{flex-direction:row; align-items:stretch}
  .wide .verdict{flex:2}
  .wide .bottom .btn{flex:1}

  @media (prefers-reduced-motion:reduce){
    .flash-inner{transition:none}
    .stamp.draw path{animation-duration:.01s}
  }

  /* ================= 모드 (일본어 쓰기 / 뜻 쓰기 / 단어장) ================= */
  .seg{display:flex; margin-top:18px; padding:3px; border-radius:12px; background:#fff;
    box-shadow:0 0 0 1px #E2E6ED, 0 2px 6px rgba(20,30,50,.05)}
  .seg button{flex:1; min-width:0; padding:0 4px; height:36px; border:0; border-radius:9px; background:none; cursor:pointer; white-space:nowrap;
    font:600 14px/1 "IBM Plex Sans KR"; color:var(--ink-2); transition:background .18s, color .18s}
  .seg button.on{background:var(--brand); color:#fff}
  .seg button small{margin-left:4px; font-size:12px; font-weight:500; opacity:.75}
  .note-seg{margin-top:-4px}
  .compact .seg{margin-top:14px} .compact .seg button{height:32px; font-size:12.5px}
  .wide .seg{max-width:440px}

  .acts{display:flex; gap:10px}
  .acts .btn{flex:1}
  #prevBtn{display:none; flex:0 0 32%}

  /* 앞면에 일본어(단어·예문)를 보여주는 모드 */
  .f-jp{display:none; width:100%; height:100%; flex-direction:column; justify-content:space-between; gap:14px; padding-top:20px}
  .f-jp-head{flex:1 0 auto; display:flex; flex-direction:column; align-items:center; justify-content:center}
  .qm-ko .front, .qm-book .front{overflow-y:auto}
  .qm-ko .front > .f-hint, .qm-ko .front > .f-meaning, .qm-ko .front > .f-pos,
  .qm-book .front > .f-hint, .qm-book .front > .f-meaning, .qm-book .front > .f-pos{display:none !important}
  .qm-ko .f-jp, .qm-book .f-jp{display:flex}
  .qm-book #fReading{display:none}
  .vertical.qm-ko .flash{flex-basis:var(--front-h, 40%)}
  .vertical.qm-ko .flash.flipped{flex-basis:var(--back-h, 52%)}
  /* 뒷면: 뜻을 크게, 단어는 작게 */
  .qm-ko .b-head, .qm-book .b-head{width:100%}
  .qm-ko .back .b-kanji, .qm-book .back .b-kanji{font-size:26px}
  .qm-ko .back .b-reading, .qm-book .back .b-reading{font-size:12px; letter-spacing:.08em}
  .qm-ko .f-jp .b-kanji{font-size:44px}
  .compact.qm-ko .f-jp .b-kanji{font-size:32px}
  .wide.qm-ko .f-jp .b-kanji{font-size:64px}
  .qm-ko .b-meaning, .qm-book .b-meaning{font-size:26px; font-weight:700; line-height:1.3; margin-top:12px; max-width:92%}
  .wide.qm-ko .b-meaning{font-size:34px}
  .wide.qm-ko .back .b-kanji{font-size:34px}
  .compact.qm-ko .b-meaning{font-size:20px; margin-top:6px}
  .compact .f-jp{gap:8px; padding-top:12px}

  /* 단어장: 쓰기 칸 없이 카드만 */
  .qm-book .pad, .qm-book .tally, .qm-book .verdict{display:none !important}
  .vertical.qm-book .flash, .vertical.qm-book .flash.flipped{flex:1 1 auto}
  .qm-book .flash{cursor:pointer; -webkit-tap-highlight-color:transparent}
  .qm-book #prevBtn{display:block}
  /* 단어장 글자 크기: 카드 크기에 맞춰 커지고 작아짐 (cqmin = 카드 짧은 변의 1%) */
  .qm-book .face{container-type:size}
  .qm-book .f-jp{padding-top:4cqmin; gap:4cqmin}
  .qm-book .f-jp .b-kanji{font-size:min(32cqmin, calc(84cqw / var(--len, 2)), 170px); line-height:1.15}
  .qm-book .ex-jp{font-size:clamp(18px, 7cqmin, 36px); line-height:2.1}
  .qm-book .ex-jp rt{font-size:.5em}
  .qm-book .ex-ko{font-size:clamp(14px, 5cqmin, 24px); line-height:1.5; margin-top:.4em}
  .qm-book .b-ex{padding:3cqmin 4.5cqmin 3.4cqmin; border-radius:min(3cqmin, 16px)}
  .qm-book .back{padding:9cqmin 5cqmin 5cqmin; gap:4cqmin}
  .qm-book .back .b-reading{font-size:clamp(13px, 4.8cqmin, 24px)}
  .qm-book .back .b-kanji{font-size:min(15cqmin, calc(64cqw / var(--len, 2)), 84px)}
  .qm-book .back .b-meaning{font-size:clamp(26px, 12.5cqmin, 64px); margin-top:3cqmin}
  .qm-book .back .b-pos{font-size:clamp(12px, 4cqmin, 20px); margin-top:1.5cqmin}
  .self-btns{display:flex; gap:6px}
  .compact .acts, .wide .acts{flex:1; align-items:stretch}

  /* ================= 시험 (JLPT 문자·어휘 4지선다) ================= */
  .exam{display:none; flex:1; min-height:0; gap:14px}
  .qm-test .exam{display:flex}
  .qm-test .flash, .qm-test .pad{display:none !important}
  /* 세로: 보기 4개는 항상 다 보이고, 길어지면 문제 카드 안에서만 스크롤 */
  .vertical .exam{flex-direction:column; padding:3px; margin:-3px}
  .vertical .q-card{flex:0 1 auto; min-height:0; overflow-y:auto}
  .vertical .q-opts{flex:none}
  @media (max-height:740px){
    .vertical .q-card{padding:36px 16px 14px; gap:10px}
    .vertical .q-ins{font-size:12.5px; padding-bottom:8px}
    .vertical .q-sent{font-size:18px; line-height:1.7}
    .vertical .q-opts{gap:7px}
    .vertical .opt{min-height:42px; padding:6px 14px; font-size:17px}
  }
  .q-card > *{flex-shrink:0}
  /* 시험 화면: 스크롤은 되지만 스크롤바는 숨김 */
  .exam, .q-card, .q-opts{scrollbar-width:none; -ms-overflow-style:none}
  .screen .exam::-webkit-scrollbar, .screen .q-card::-webkit-scrollbar, .screen .q-opts::-webkit-scrollbar{display:none; width:0; height:0}
  .q-card{position:relative; flex:none; display:flex; flex-direction:column; gap:14px; padding:44px 20px 20px; border-radius:var(--radius-lg);
    background:var(--card); box-shadow:0 0 0 1px #E2E6ED, 0 1px 2px rgba(20,30,50,.04), 0 12px 32px rgba(20,30,50,.08)}
  .q-card .hole{position:absolute; top:16px; left:22px; width:14px; height:14px; border-radius:50%; background:var(--paper); box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
  .q-card .chip{position:absolute; top:14px; right:16px; font-size:12px; font-weight:700; padding:3px 9px; border-radius:99px; background:var(--lv); color:var(--lv-d)}
  .q-card .rv-tag{position:absolute; top:14px; left:44px; display:none; align-items:center; gap:4px; height:22px; padding:0 8px; border-radius:99px;
    background:#FFF0EC; color:var(--shu); font-size:11.5px; font-weight:700}
  .q-card .rv-tag::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--shu)}
  .q-card .rv-tag.on{display:inline-flex}
  .q-ins{font-family:"Klee One"; font-size:14px; line-height:1.6; color:var(--ink-2); padding-bottom:12px; border-bottom:1px dashed #DDE3EC}
  .q-ins b{display:inline-block; margin-right:8px; padding:0 7px; border:1.5px solid var(--ink-2); border-radius:4px; font-weight:600; font-size:12.5px; color:var(--ink)}
  .q-sent{font-family:"Klee One"; font-size:21px; line-height:1.8; color:var(--ink); word-break:normal; line-break:strict}
  .q-sent u{text-decoration:none; padding:0 1px; border-bottom:2px solid var(--ink); font-weight:600}
  .q-sent .blank{display:inline-block; min-width:4.2em; text-align:center; color:var(--ink-3)}
  .q-ko{display:none; font-size:13.5px; line-height:1.55; color:var(--ink-2); padding-top:10px; border-top:1px dashed #DDE3EC}
  .q-ko.show{display:block}
  .q-opts{display:grid; grid-template-columns:1fr; gap:10px; align-content:start}
  .opt{display:flex; align-items:center; gap:12px; min-height:52px; padding:10px 16px; text-align:left; cursor:pointer;
    background:#fff; border:0; border-radius:14px; box-shadow:0 0 0 1px #E2E6ED, 0 2px 6px rgba(20,30,50,.05);
    font-family:"Klee One"; font-size:19px; font-weight:600; color:var(--ink); transition:box-shadow .15s, background .15s}
  .opt .no{flex:none; display:grid; place-items:center; width:26px; height:26px; border-radius:50%; border:1.5px solid #C9D1DE;
    font:700 13px/1 "IBM Plex Sans KR"; color:var(--ink-2)}
  /* 보기: 단어 아래에 한국어 뜻 전체 (길면 줄바꿈) */
  .opt .tx{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
  .opt .w{overflow-wrap:anywhere}
  .opt .gl{font:500 13px/1.45 "IBM Plex Sans KR"; color:var(--ink-2); word-break:keep-all; overflow-wrap:anywhere}
  .opt .gl:empty{display:none}
  .opt.dim .gl{color:var(--ink-3)}
  /* 채점 후에는 뜻이 붙어 길어지므로 화면 전체를 스크롤 */
  .vertical .exam.done{overflow-y:auto}
  .qm-test .verdict .s{white-space:normal; overflow:visible}
  .compact .opt{padding-top:7px; padding-bottom:7px}
  .vertical .exam.done .q-card{flex:none; overflow:visible}
  .opt:not(:disabled):active{background:var(--brand-soft)}
  .opt:disabled{cursor:default}
  .opt.right{box-shadow:0 0 0 2px var(--ok); background:#F1FBF6}
  .opt.right .no{background:var(--ok); border-color:var(--ok); color:#fff}
  .opt.wrong{box-shadow:0 0 0 2px var(--shu); background:#FFF5F2}
  .opt.wrong .no{background:var(--shu); border-color:var(--shu); color:#fff}
  .opt.dim{opacity:.55}
  .compact .exam, .wide .exam{flex-direction:row}
  .compact .q-card, .wide .q-card{flex:1.2; overflow-y:auto}
  .compact .q-opts, .wide .q-opts{flex:1; overflow-y:auto; padding:3px; margin:-3px}
  .compact .q-card{padding:36px 16px 14px; gap:10px}
  .compact .q-sent{font-size:18px}
  .compact .opt{min-height:44px; font-size:17px; padding:6px 14px}
  .compact .q-opts{gap:8px}
  .wide .q-sent{font-size:26px}
  .wide .q-ins{font-size:16px}
  .wide .opt{min-height:64px; font-size:22px}
  .wide .q-card{padding:52px 32px 28px}


  /* 홈 상단: 이름 */
  .brand .name{display:flex; flex-direction:column; gap:8px}
  .brand .title .mark{font-family:"IBM Plex Sans KR", system-ui, -apple-system, sans-serif; font-weight:700; font-size:30px; line-height:1; letter-spacing:.06em; color:var(--ink)}
  .brand .tag{font-size:13px; font-weight:500; line-height:1; color:var(--ink-3)}
  .compact .brand .title .mark{font-size:24px}
  .wide .brand .title .mark{font-size:38px}
  .wide .brand .tag{font-size:14.5px}

  /* 모드 선택: 고른 모드에 형광펜을 긋듯 노란 줄이 쓱 그어짐 */
  .modes{display:flex; flex-wrap:wrap; gap:6px 24px; margin-top:24px}
  .modes button{position:relative; isolation:isolate; padding:6px 1px 7px; border:0; background:none; cursor:pointer; white-space:nowrap;
    font:600 16px/1.2 "IBM Plex Sans KR"; color:var(--ink-3); transition:color .25s; -webkit-tap-highlight-color:transparent}
  .modes button span{position:relative; z-index:1}
  .modes button::before{content:""; position:absolute; z-index:0; left:-6px; right:-6px; bottom:6px; height:.66em;
    background:#FFE066; border-radius:3px 7px 4px 8px / 7px 3px 8px 4px; opacity:.9;
    transform:scaleX(0) skewX(-14deg) rotate(-1.2deg); transform-origin:0 50%; transition:transform .38s cubic-bezier(.3,.8,.25,1)}
  .modes button.on{color:var(--ink)}
  .modes button.on::before{transform:scaleX(1) skewX(-14deg) rotate(-1.2deg)}
  .modes button:not(.on):active{color:var(--ink-2)}
  .modes button:focus-visible{outline:2px solid var(--brand); outline-offset:3px; border-radius:4px}
  .mode-desc{margin:10px 1px 0; font-size:13.5px; line-height:1.55; color:var(--ink-2); word-break:keep-all}
  .compact .modes{gap:4px 16px; margin-top:16px}
  .compact .modes button{font-size:14px}
  .compact .mode-desc{font-size:12.5px; margin-top:7px}
  .wide .modes{gap:8px 34px; margin-top:30px}
  .wide .modes button{font-size:19px}
  .wide .mode-desc{font-size:15px; margin-top:12px}
</style>
</head>
<body>
<div class="screen vertical" id="screen">

  <!-- 처음 실행: 단어 파일 불러오기 -->
  <section class="view setup" id="setupView">
    <div class="brand">
      <div class="title"><div class="name"><span class="mark">VOCABOX</span><span class="tag">JLPT N5 – N1 학습 노트</span></div></div>
      <p class="lead">단어 파일을 한 번만 불러오면 돼요</p>
    </div>
    <div class="setup-card">
      <ol>
        <li><b>words_personal.json</b> 파일을 iPhone의 「파일」 앱에 저장해 두세요.</li>
        <li>아래 버튼을 눌러 그 파일을 고르세요.</li>
        <li>단어는 이 iPhone 안에만 저장되고, 다음부터는 바로 시작해요.</li>
      </ol>
    </div>
    <button class="btn primary" id="pickWords" style="max-width:420px">단어 파일 불러오기</button>
    <div class="setup-msg" id="setupMsg"></div>
  </section>

  <section class="view home-view tabbed" id="homeView">
    <div class="h-top">
      <div class="brand">
        <div class="title"><div class="name"><span class="mark">VOCABOX</span><span class="tag">JLPT N5 – N1 학습 노트</span></div></div>
      </div>
      <nav class="modes" id="modeSeg" aria-label="학습 방법">
        <button data-m="book"><span>단어장</span></button><button data-m="jp"><span>일본어 쓰기</span></button><button data-m="ko"><span>뜻 쓰기</span></button><button data-m="test"><span>시험</span></button>
      </nav>
      <p class="mode-desc" id="homeSub"></p>
    </div>
    <div class="sec">레벨</div>
    <div class="decks" id="decks"></div>
  </section>

  <section class="view tabbed" id="noteView" style="gap:16px"></section>
  <section class="view tabbed" id="statsView" style="gap:14px"></section>

      <section class="view quiz-view" id="quizView">
        <div class="qhead">
          <button class="icon-btn" id="back" aria-label="홈으로">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <div class="qtitle" id="qtitle"></div>
          <div class="tally" id="tally"></div>
        </div>
        <div class="bar"><i id="bar"></i></div>

        <div class="main" id="main">
          <div class="flash" id="flash">
            <div class="flash-inner">
              <div class="face front">
                <span class="hole"></span><span class="chip" id="chipF"></span><span class="rv-tag" id="rvTagF">복습</span>
                <div class="f-hint" id="hint2"></div>
                <div class="f-meaning" id="meaning"></div>
                <div class="f-pos" id="pos"></div>
                <div class="f-jp">
                  <div class="f-jp-head">
                    <div class="b-reading" id="fReading"></div>
                    <div class="b-kanji" id="fKanji"></div>
                  </div>
                  <div class="b-ex" id="fExBox"><p class="ex-jp" id="fEx"></p></div>
                </div>
              </div>
              <div class="face back">
                <span class="hole"></span><span class="chip" id="chipB"></span><span class="rv-tag" id="rvTagB">복습</span>
                <div class="b-head">
                  <div class="b-reading" id="reading"></div>
                  <div class="b-kanji" id="kanji"></div>
                  <div class="b-meaning" id="meaningB"></div>
                  <div class="b-pos" id="posB"></div>
                </div>
                <div class="b-ex">
                  <p class="ex-jp" id="exJp"></p>
                  <p class="ex-ko" id="exKo"></p>
                </div>
              </div>
            </div>
          </div>

          <div class="exam" id="exam">
            <div class="q-card">
              <span class="hole"></span><span class="chip" id="chipQ"></span><span class="rv-tag" id="rvTagQ">복습</span>
              <div class="q-ins" id="qIns"></div>
              <div class="q-sent" id="qSent"></div>
              <div class="q-ko" id="qKo"></div>
            </div>
            <div class="q-opts" id="qOpts"></div>
          </div>

          <div class="pad">
            <div class="sheet" id="sheet">
              <div class="hint" id="hint">여기에 쓰세요</div>
              <canvas id="canvas"></canvas>
              <svg class="stamp" id="stamp" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet"></svg>
            </div>
            <div class="tools">
              <button class="tool" id="undo">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg>
                한 획 지우기</button>
              <button class="tool" id="clear">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
                전부 지우기</button>
            </div>
          </div>
        </div>

        <div class="bottom" id="bottom">
          <div class="verdict" id="verdict"></div>
          <div class="acts">
            <button class="btn ghost" id="prevBtn">이전</button>
            <button class="btn primary" id="action">제출</button>
          </div>
        </div>

        <div class="result" id="result">
          <div class="left">
            <div class="score">
              <div class="num" id="scoreNum"></div>
              <div class="msg" id="scoreMsg"></div>
            </div>
            <div class="actions" id="actions"></div>
          </div>
          <div class="review" id="review"></div>
        </div>
      </section>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-tab="homeView"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3.5" width="13" height="17" rx="2.5"/><path d="M8 8h5M8 12h5"/><path d="M20 7v12.5a1.5 1.5 0 0 1-1.5 1.5H8"/></svg><span class="lb">학습</span></button>
    <button class="tab" data-tab="noteView"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M9 10l6 6M15 10l-6 6"/></svg><span class="lb">오답노트</span><span class="dot" id="noteDot"></span></button>
    <button class="tab" data-tab="statsView"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg><span class="lb">기록</span></button>
  </nav>
</div>

<input type="file" id="fileWords" accept=".json,application/json" hidden>
<input type="file" id="fileBackup" accept=".json,application/json" hidden>

<script src="recognizer.js"></script>
<script src="segment.js"></script>
<script src="app.js"></script>
<script src="patterns.js" defer></script>
</body>
</html>
